<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cassette</title>
<style>
:root{
  --bg:#e4e4e2; --fg:#0c0c0c; --muted:#8b8b86; --soft:#c4c4c0; --card:#efefed; --hair:rgba(0,0,0,.14);
  --m1:#fafafa; --m2:#c9c9c9; --m3:#8e8e8e; --m4:#6c6c6c; --shell:#161616; --shell2:#262626; --label:#f3f1ea; --labelInk:#1a1a1a;
  --inv-bg:#0c0c0c; --inv-fg:#f4f4f2; --led:#e2382e;
  --mono:"Cascadia Mono","Consolas","SF Mono",ui-monospace,monospace;
  --sans:"Segoe UI","SF Pro Text",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --fg:#f2f2f0; --muted:#76766f; --soft:#2e2e2c; --card:#171716; --hair:rgba(255,255,255,.14);
  --m1:#4a4a4a; --m2:#262626; --m3:#151515; --m4:#0a0a0a; --shell:#e9e7e1; --shell2:#cfccc4; --label:#151515; --labelInk:#eeeeea;
  --inv-bg:#f2f2f0; --inv-fg:#0d0d0d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1000px;height:700px;overflow:hidden;cursor:default;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
img,svg,canvas{-webkit-user-drag:none;user-drag:none}
button,input,[role=button]{outline:none}
button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);user-select:none;-webkit-user-select:none;padding:22px 30px 0}
body,.knob circle,.knob path,.pill,.btn{transition:background-color .45s,color .45s,border-color .45s,fill .45s,stroke .45s}
svg{display:block}
.pix{fill:currentColor;shape-rendering:crispEdges}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

header{display:flex;align-items:center;gap:26px;height:40px}
.logo{height:21px}
.hint{flex:0 0 360px;height:32px;border:2px solid var(--fg);border-radius:18px;display:flex;align-items:center;gap:9px;padding:0 13px;font:600 11.5px var(--mono);overflow:hidden;white-space:nowrap}
.hint svg{flex:none}
.hint input{flex:1;min-width:0;border:0;outline:0;background:none;color:inherit;font:inherit;user-select:text;-webkit-user-select:text}
.hint input::placeholder{color:var(--muted);opacity:1}
.hint:focus-within{background:var(--hair)}
.hint .x{display:none;font-weight:700;padding:0 2px}
.hint.has .x{display:block}
.counter .sq{cursor:pointer}
.counter .del{display:none;width:26px;height:26px;border-radius:5px;border:2px solid var(--fg);place-items:center}
.counter .del.show{display:grid}
.counter .del:hover{background:var(--hair)}
.counter .del.armed{background:var(--led);border-color:var(--led);color:#fff}
.counter .sq:hover{transform:scale(1.1)}
.counter .sq.open{background:var(--led);color:#fff}
.save-row{display:flex;gap:8px;margin-top:14px;height:0;opacity:0;overflow:hidden;pointer-events:none;transition:height .25s,opacity .2s}
.save-row.open{height:34px;opacity:1;pointer-events:auto}
.save-row input{flex:1;min-width:0;border:2px solid var(--fg);border-radius:17px;background:none;color:var(--fg);padding:0 14px;font:700 12px var(--mono);outline:0;user-select:text;-webkit-user-select:text}
.save-row button{border:2px solid var(--fg);border-radius:17px;padding:0 16px;font:700 12px var(--mono);background:var(--fg);color:var(--bg)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.badge{font:700 11px var(--mono);border:2px solid var(--fg);border-radius:6px;padding:3px 7px;letter-spacing:.5px}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.icon-btn:hover{background:var(--hair)}

main{display:grid;grid-template-columns:440px 1fr;gap:42px;margin-top:16px}

/* ── Izquierda: vistas (cinta / espacio) ── */
.views{display:flex;gap:6px;margin-bottom:18px}
.vt{position:relative;border:2px solid var(--fg);border-radius:14px;padding:3px 13px;font:700 12px var(--mono);letter-spacing:.5px}
.vt.on{background:var(--fg);color:var(--bg)}
.vt:not(.on):hover{background:var(--hair)}
.vt.sel:not(.on)::after{content:"";position:absolute;left:50%;bottom:-8px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--fg)}
.vw{transform-box:view-box;transition:opacity .3s ease,transform .6s cubic-bezier(.3,1.45,.5,1)}
.vw.off{opacity:0;transform:translateY(34px);pointer-events:none}
.pane{transition:opacity .3s ease,transform .55s cubic-bezier(.3,1.4,.5,1)}
.pane.off{opacity:0;transform:translateX(24px);pointer-events:none;position:absolute;visibility:hidden}
#panes{position:relative}
#deck[data-type="1"]{--shell:#2a3542;--shell2:#3b4858}
#deck[data-type="2"]{--shell:#979ea6;--shell2:#b7bdc4}
:root[data-theme="dark"] #deck[data-type="1"]{--shell:#c3cfdc;--shell2:#a9b8c8}
:root[data-theme="dark"] #deck[data-type="2"]{--shell:#7b828a;--shell2:#9aa1a9}
#cass rect:first-child,#cass path{transition:fill .5s}

.deck{filter:drop-shadow(0 18px 18px rgba(0,0,0,.18))}
:root[data-theme="dark"] .deck{filter:drop-shadow(0 18px 22px rgba(0,0,0,.6))}
#cass{transform-box:fill-box;transform-origin:center}
#cass.swap{animation:swap .62s cubic-bezier(.3,1.5,.5,1)}
@keyframes swap{0%{transform:translateY(0)}35%{transform:translateY(-26px);opacity:.25}36%{transform:translateY(-26px) scaleX(.96)}100%{transform:translateY(0);opacity:1}}
.title-row{display:flex;align-items:center;justify-content:space-between;margin-top:26px;height:34px}
#title{height:28px}
.counter{display:flex;align-items:center;gap:9px}
.counter .sq{width:26px;height:26px;border-radius:5px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.cat{display:inline-block;margin-top:9px;background:var(--fg);color:var(--bg);font:700 12px var(--mono);letter-spacing:1px;padding:4px 12px;border-radius:12px}
.wave-row{display:flex;align-items:center;margin-top:22px}
#wave{flex:1;min-width:0;height:48px;display:block}
.transport{display:flex;align-items:center;justify-content:center;gap:44px;margin-top:20px}
.transport .t{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.transport .t:hover{background:var(--hair)}
.play{width:66px!important;height:66px!important;background:var(--fg)!important;color:var(--bg);border-radius:50%;transition:transform .15s,background-color .45s,color .45s}
.play:active{transform:scale(.94)}
.play.off{background:transparent!important;color:var(--fg);box-shadow:inset 0 0 0 3px var(--fg)}

/* ── Derecha ── */
.r-head{display:flex;align-items:flex-end;justify-content:space-between}
.r-head .link{font:700 12px var(--mono);text-decoration:underline;text-underline-offset:3px}
.pills{display:flex;gap:6px;margin-top:12px}
.pill{border:2px solid var(--fg);border-radius:14px;padding:3px 12px;font:700 12px var(--mono);letter-spacing:.5px}
.pill.on{background:var(--fg);color:var(--bg)}
.pill:not(.on):hover{background:var(--hair)}

.wheel{position:relative;height:222px;margin-top:8px;overflow:hidden;cursor:grab;outline:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent)}
.wheel.drag{cursor:grabbing}
.wheel svg.ticks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wheel svg.ticks line{stroke:var(--fg)}
.wheel svg.ticks text{fill:var(--fg);font:700 10px var(--mono);letter-spacing:1px}
.chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:9px;padding:8px 15px;border:2px solid var(--fg);border-radius:22px;white-space:nowrap;will-change:transform,opacity;cursor:pointer}
.chip .pn{height:14px}
.chip small{font:700 10px var(--mono);opacity:.6;letter-spacing:.5px}
.chip.on{background:var(--fg);color:var(--bg)}

.c-head{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.age-row{display:flex;align-items:center;gap:16px;margin-top:14px}
.age-row .meta{flex:1}
.age-row .meta b{display:block;font:700 16px var(--mono);letter-spacing:.5px}
.age-row .meta span{font-size:13px;color:var(--muted)}
.age-row .meta u{text-decoration:none}
.age-row .meta b span{font:inherit;color:var(--muted);margin-left:6px}
.year{width:62px;height:62px;border-radius:50%;border:3px solid var(--fg);display:grid;place-items:center;font:800 15px var(--mono)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 4px;margin-top:16px}
#gridSpace{grid-template-columns:repeat(4,1fr)}
.k{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border-radius:10px}
.k:hover{background:var(--hair)}
.k b{font:700 11px var(--mono);letter-spacing:.5px}
.k i{font:600 11px var(--mono);font-style:normal;color:var(--muted)}
.knob{cursor:ns-resize;touch-action:none}
.knob .track{stroke:var(--soft)}
.knob .arc{stroke:var(--fg)}
.knob .face{fill:var(--card);stroke:var(--fg)}
.knob .ptr{stroke:var(--fg)}
.toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);font:700 12px var(--mono);padding:8px 14px;border-radius:16px;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <svg class="logo pix" id="logo"></svg>
  <div class="hint">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Buscar cinta…" spellcheck="false" autocomplete="off" aria-label="Buscar cinta">
    <button class="x" id="searchX" aria-label="Limpiar búsqueda">×</button>
  </div>
  <div class="hdr-right">
    <span class="badge" id="badge">FREE</span>
    <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema"></button>
  </div>
</header>

<main>
  <section>
    <div class="views" id="views">
      <button class="vt on" data-v="tape">CINTA</button>
      <button class="vt" data-v="0">ROOM</button>
      <button class="vt" data-v="1">HALL</button>
      <button class="vt" data-v="2">SPACE</button>
    </div>
    <svg class="deck" id="deck" data-type="0" width="440" height="292" viewBox="0 0 440 292">
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--m1)"/><stop offset=".45" stop-color="var(--m2)"/><stop offset=".55" stop-color="var(--m1)"/><stop offset="1" stop-color="var(--m3)"/>
        </linearGradient>
        <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--m1)"/><stop offset="1" stop-color="var(--m4)"/></linearGradient>
        <radialGradient id="knobg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="var(--m1)"/><stop offset="1" stop-color="var(--m3)"/></radialGradient>
        <pattern id="grill" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.6" fill="var(--m4)"/></pattern>
        <clipPath id="tapeClip"><rect x="112" y="112" width="148" height="34" rx="17"/></clipPath>
        <clipPath id="winClip"><rect x="40" y="40" width="292" height="192" rx="14"/></clipPath>
      </defs>
      <rect x="4" y="4" width="432" height="284" rx="22" fill="url(#bevel)"/>
      <rect x="8" y="8" width="424" height="276" rx="19" fill="url(#metal)"/>
      <g fill="var(--m4)"><circle cx="24" cy="24" r="4"/><circle cx="416" cy="24" r="4"/><circle cx="24" cy="268" r="4"/><circle cx="416" cy="268" r="4"/></g>
      <rect x="36" y="36" width="300" height="200" rx="17" fill="var(--m4)"/>
      <rect x="40" y="40" width="292" height="192" rx="14" fill="#0b0b0b"/>
      <g clip-path="url(#winClip)"><g id="tapeView" class="vw">
        <g id="cass">
          <rect x="54" y="52" width="264" height="168" rx="10" fill="var(--shell)"/>
          <rect x="66" y="62" width="240" height="92" rx="6" fill="var(--label)"/>
          <g stroke="var(--labelInk)" stroke-opacity=".25" stroke-width="1"><line x1="78" y1="92" x2="294" y2="92"/><line x1="78" y1="104" x2="294" y2="104"/></g>
          <text id="labelTxt" x="80" y="86" fill="var(--labelInk)" style="font:700 13px var(--mono);letter-spacing:1px">CASSETTE 90S</text>
          <text x="294" y="86" fill="var(--labelInk)" text-anchor="end" style="font:800 15px var(--mono)">A</text>
          <rect x="112" y="112" width="148" height="34" rx="17" fill="#0b0b0b"/>
          <g clip-path="url(#tapeClip)"><g id="packL"><circle cx="136" cy="129" r="13" fill="#3a2a20"/></g><g id="packR"><circle cx="236" cy="129" r="13" fill="#3a2a20"/></g></g>
          <g id="reelL" transform="translate(136 129)"></g>
          <g id="reelR" transform="translate(236 129)"></g>
          <path d="M96 220 L108 186 H264 L276 220 Z" fill="var(--shell2)"/>
          <g fill="#0b0b0b"><circle cx="128" cy="204" r="5"/><circle cx="244" cy="204" r="5"/><rect x="170" y="196" width="32" height="14" rx="2"/></g>
          <text id="typeTxt" x="66" y="176" fill="var(--labelInk)" fill-opacity=".55" style="font:700 10px var(--mono)">C-60 · TYPE I</text>
        </g>
      </g></g>
      <g clip-path="url(#winClip)"><g id="spaceView" class="vw off">
        <rect x="40" y="40" width="292" height="192" fill="#0b0b0b"/>
        <g id="sceneStatic"></g>
        <g id="sceneDyn"></g>
        <text id="scLabel" x="54" y="222" fill="#f2f2f0" style="font:700 11px var(--mono);letter-spacing:1px">ROOM</text>
        <text id="scInfo" x="318" y="58" text-anchor="end" fill="#f2f2f0" fill-opacity=".6" style="font:700 10px var(--mono)">PRE 20 ms</text>
      </g></g>
      <rect x="40" y="40" width="292" height="192" rx="14" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>

      <rect x="350" y="36" width="70" height="78" rx="9" fill="var(--m4)"/>
      <rect x="353" y="39" width="64" height="72" rx="7" fill="#f2ead2"/>
      <path d="M362 92 A28 28 0 0 1 408 92" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
      <path d="M398 80 A28 28 0 0 1 408 92" fill="none" stroke="#e2382e" stroke-width="3"/>
      <text x="385" y="58" text-anchor="middle" fill="#1a1a1a" style="font:700 8px var(--mono)">VU</text>
      <line id="needle" x1="385" y1="104" x2="385" y2="66" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="385" cy="104" r="4" fill="#1a1a1a"/>

      <rect x="378" y="128" width="14" height="96" rx="4" fill="var(--m4)"/>
      <g id="slider"><rect x="366" y="0" width="38" height="16" rx="3" fill="url(#knobg)" stroke="var(--m4)"/><line x1="370" y1="8" x2="400" y2="8" stroke="var(--m4)" stroke-width="2"/></g>
      <text id="sliderLbl" x="349" y="132" fill="var(--m4)" style="font:700 8px var(--mono)">WOW</text>

      <rect x="40" y="246" width="200" height="30" rx="6" fill="url(#grill)" opacity=".8"/>
      <circle id="led" cx="262" cy="261" r="5" fill="var(--led)"/>
      <circle cx="306" cy="261" r="14" fill="url(#knobg)" stroke="var(--m4)" stroke-width="1.5"/>
      <circle cx="306" cy="261" r="5" fill="var(--m4)"/>
      <circle cx="398" cy="252" r="16" fill="url(#knobg)" stroke="var(--m4)" stroke-width="1.5"/>
      <line id="miniPtr" x1="398" y1="252" x2="398" y2="240" stroke="var(--m4)" stroke-width="3" stroke-linecap="round"/>
    </svg>

    <div class="title-row">
      <svg id="title" class="pix"></svg>
      <div class="counter">
        <button class="del" id="delBtn" title="Borrar esta cinta" aria-label="Borrar cinta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
        <div class="sq" id="saveBtn" role="button" title="Guardar esta cinta como preset" aria-label="Guardar cinta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M12 5v14M5 12h14"/></svg></div>
        <svg id="pnum" class="pix" height="22"></svg>
      </div>
    </div>
    <span class="cat" id="cat">VINTAGE</span>
    <div class="wave-row">
      <canvas id="wave"></canvas>
    </div>
    <form class="save-row" id="saveRow">
      <input id="saveName" type="text" maxlength="18" placeholder="Nombre de tu cinta" spellcheck="false" autocomplete="off">
      <button type="submit">GUARDAR</button>
    </form>
    <div class="transport">
      <button class="t" id="rnd" title="Cinta aleatoria" aria-label="Cinta aleatoria"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 9a3.5 3.5 0 1 1 5.2 3c-1.2.7-1.7 1.4-1.7 2.6"/><path d="M12 19v.01"/></svg></button>
      <button class="t" id="prev" title="Preset anterior" aria-label="Preset anterior"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M18 5L8 12l10 7z"/><path d="M5 5v14"/></svg></button>
      <button class="t play" id="play" title="Activar / bypass" aria-label="Bypass"></button>
      <button class="t" id="next" title="Preset siguiente" aria-label="Preset siguiente"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M6 5l10 7-10 7z"/><path d="M19 5v14"/></svg></button>
      <button class="t" id="reset" title="Volver al preset" aria-label="Volver al preset"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg></button>
    </div>
  </section>

  <section>
    <div class="r-head">
      <svg id="hPresets" class="pix" height="30"></svg>
      <span class="link" id="countLink">8 cintas</span>
    </div>
    <div class="pills" id="pills"></div>
    <div class="wheel" id="wheel" tabindex="0" aria-label="Selector de presets">
      <svg class="ticks" id="ticks"></svg>
    </div>
    <div class="c-head"><svg id="hCtrl" class="pix" height="18"></svg></div>
    <div id="panes">
      <div class="pane" id="paneTape">
        <div class="age-row" data-hint="Edad: escala la intensidad de todo el plugin">
          <div id="k_age"></div>
          <div class="meta"><b>EDAD</b><span>Un solo knob para envejecer la cinta</span></div>
          <div class="year" id="year">1994</div>
        </div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="pane off" id="paneSpace">
        <div class="age-row" data-hint="Reverb: cuánto del lugar se escucha">
          <div id="k_spaceAmt"></div>
          <div class="meta"><b>REVERB <span id="v_spaceAmt"></span></b><span><u id="spName">ROOM</u> · <u id="spDesc">Una habitación chica y cercana</u></span></div>
          <div class="year" id="decay">0.9s</div>
        </div>
        <div class="grid" id="gridSpace"></div>
      </div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

}

/* ═══════════ Transporte, tema ═══════════ */
const ICON_PAUSE = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>';
const ICON_PLAY = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
function renderBypass() { $('play').innerHTML = S.bypass ? ICON_PLAY : ICON_PAUSE; $('play').classList.toggle('off', S.bypass); }
$('play').onclick = () => { S.bypass = !S.bypass; native('setParam', 'bypass', S.bypass ? 1 : 0); renderBypass(); toast(S.bypass ? 'Bypass: señal original' : 'Cinta activada'); };
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('reset').onclick = () => { const p = S.presets[S.program]; Object.entries(p.values).forEach(([k, v]) => setParam(k, v)); toast('Preset restaurado'); };
$('rnd').onclick = () => {
  ['age', 'wobble', 'noise', 'crush', 'tone', 'drive'].forEach(k => {
    const lim = { age: [.35, .95], crush: [0, .5], tone: [.2, .9] }[k] || [.15, .85];
    native('gesture', k, true); setParam(k, lim[0] + Math.random() * (lim[1] - lim[0])); native('gesture', k, false);
  });
  toast('Cinta aleatoria');
};
const SUN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function applyTheme(t) { S.theme = t; document.documentElement.dataset.theme = t; $('themeBtn').innerHTML = t === 'dark' ? SUN : MOON; }
$('themeBtn').onclick = e => {
  const next = S.theme === 'dark' ? 'light' : 'dark';
  native('setTheme', next);
  if (document.startViewTransition) {                       // revelado circular desde el botón
    const r = e.currentTarget.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    document.documentElement.style.setProperty('--vx', x + 'px'); document.documentElement.style.setProperty('--vy', y + 'px');
    document.startViewTransition(() => applyTheme(next));
    setTimeout(() => { if (S.theme !== next) applyTheme(next); }, 350);   // si la transición no llega a pintarse
  } else applyTheme(next);
};
const vt = document.createElement('style');
vt.textContent = `::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .6s cubic-bezier(.6,0,.2,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--vx) var(--vy))}to{clip-path:circle(1400px at var(--vx) var(--vy))}}`;
document.head.appendChild(vt);

/* ═══════════ Que no parezca una página web ═══════════ */
const editable = t => t && t.closest && t.closest('input, textarea');
document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); });   // sin menú "Atrás / Recargar / Inspeccionar"
['dragstart', 'selectstart', 'dragover', 'drop'].forEach(ev => document.addEventListener(ev, e => { if (!editable(e.target)) e.preventDefault(); }));
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });   // sin zoom
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (k === 'f5' || k === 'f12' || k === 'f7' || (mod && 'rpsufgojhd'.includes(k) && k.length === 1 && !editable(e.target)) || (mod && ['+', '-', '=', '0'].includes(k)) || (mod && e.shiftKey && 'ijc'.includes(k)) || (e.altKey && (k === 'arrowleft' || k === 'arrowright')))
    e.preventDefault();
}, true);
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));

/* ═══════════ Arranque ═══════════ */
pix($('logo'), 'CASSETTE', 21);
pix($('hPresets'), 'CINTAS', 30);
pix($('hCtrl'), 'CONTROLES (10)', 16);

/* ═══════════ Espacio: vistas y monitor de reflexiones ═══════════ */
function setView(v) {
  S.view = v;
  const space = v === 'space';
  $('tapeView').classList.toggle('off', space); $('spaceView').classList.toggle('off', !space);
  $('paneTape').classList.toggle('off', space); $('paneSpace').classList.toggle('off', !space);
  pix($('hCtrl'), space ? 'ESPACIO (5)' : 'CONTROLES (10)', 16);
  $('sliderLbl').textContent = space ? 'SIZE' : 'WOW';
  renderTabs();
}
function renderTabs() {
  document.querySelectorAll('#views .vt').forEach(b => {
    const isType = b.dataset.v !== 'tape';
    b.classList.toggle('on', isType ? (S.view === 'space' && +b.dataset.v === S.params.spaceType) : S.view === 'tape');
    b.classList.toggle('sel', isType && +b.dataset.v === S.params.spaceType);
  });
}
document.querySelectorAll('#views .vt').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.v === 'tape') { setView('tape'); return; }
  const t = +b.dataset.v;
  if (t !== S.params.spaceType) setParam('spaceType', t);
  if (S.params.spaceAmt < 0.02) { native('gesture', 'spaceAmt', true); setParam('spaceAmt', 0.3); native('gesture', 'spaceAmt', false); }
  setView('space');
}));

// La cinta también cambia con el espacio: Type I (room), Type II CrO2 (hall), Type IV Metal (space)
function applySpaceType() {
  const t = S.params.spaceType, sp = SPACES[t];
  $('deck').dataset.type = String(t);
  $('typeTxt').textContent = sp.tape;
  $('spName').textContent = sp.name; $('spDesc').textContent = sp.desc;
  $('scLabel').textContent = sp.name;
  if (SC.type !== t) { SC.type = t; SC.rings = []; buildScene(t); }
  renderTabs();
}

const SC = { type: -1, rings: [], t: 0, lastSpawn: 0, prevVu: 0 };
const GEOM = [
  { x0: 82, y0: 64, x1: 290, y1: 206, sx: 128, sy: 160, speed: 150 },   // room
  { x0: 56, y0: 58, x1: 316, y1: 212, sx: 84,  sy: 135, speed: 95 },    // hall
  { sx: 118, sy: 150, speed: 52 }                                        // space
];
function buildScene(t) {
  const g = GEOM[t]; let s = '';
  if (t === 0) {
    s += `<rect x="${g.x0}" y="${g.y0}" width="${g.x1 - g.x0}" height="${g.y1 - g.y0}" fill="none" stroke="#f2f2f0" stroke-width="2.5"/>`;
    s += `<rect x="${g.x1 - 70}" y="${g.y0 + 8}" width="58" height="22" rx="4" fill="none" stroke="#f2f2f0" stroke-opacity=".35"/>`;
    s += `<rect x="${g.x1 - 64}" y="${g.y1 - 40}" width="34" height="30" rx="2" fill="none" stroke="#f2f2f0" stroke-opacity=".35"/>`;
    s += `<line x1="${g.x0}" y1="${g.y1 - 44}" x2="${g.x0}" y2="${g.y1 - 14}" stroke="#0b0b0b" stroke-width="4"/>`;
  } else if (t === 1) {
    s += `<rect x="${g.x0}" y="${g.y0}" width="${g.x1 - g.x0}" height="${g.y1 - g.y0}" rx="3" fill="none" stroke="#f2f2f0" stroke-width="2.5"/>`;
    s += `<path d="M${g.x0} 96 Q112 135 ${g.x0} 174" fill="#f2f2f0" fill-opacity=".12" stroke="#f2f2f0" stroke-opacity=".6"/>`;
    for (let x = 132; x <= 300; x += 12) for (let y = 70; y <= 200; y += 11) {
      if (Math.hypot(x - 70, (y - 135) * 1.2) < 70) continue;
      s += `<rect x="${x}" y="${y}" width="6" height="4" rx="1" fill="#f2f2f0" fill-opacity=".28"/>`;
    }
  } else {
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 70; i++) s += `<circle class="star" cx="${(44 + rnd() * 286).toFixed(1)}" cy="${(44 + rnd() * 184).toFixed(1)}" r="${(0.5 + rnd() * 1.1).toFixed(2)}" fill="#f2f2f0" fill-opacity="${(0.25 + rnd() * 0.6).toFixed(2)}"/>`;
    s += `<circle cx="272" cy="92" r="17" fill="#0b0b0b" stroke="#f2f2f0" stroke-width="2"/><path d="M272 75a17 17 0 0 1 0 34" fill="#f2f2f0" fill-opacity=".2"/>`;
    s += `<ellipse cx="272" cy="92" rx="31" ry="7" fill="none" stroke="#f2f2f0" stroke-width="1.6" transform="rotate(-18 272 92)"/>`;
  }
  s += `<circle cx="${g.sx}" cy="${g.sy}" r="4.5" fill="#f2f2f0"/>`;
  if (t < 2) s += `<clipPath id="roomClip"><rect x="${g.x0}" y="${g.y0}" width="${g.x1 - g.x0}" height="${g.y1 - g.y0}"/></clipPath>`;
  $('sceneStatic').innerHTML = s;
  if (t < 2) $('sceneDyn').setAttribute('clip-path', 'url(#roomClip)'); else $('sceneDyn').removeAttribute('clip-path');
}
function spawnRing(strength) {
  const t = S.params.spaceType, pre = S.params.spacePre / 1000;
  SC.rings.push({ t0: SC.t + pre, a: strength });
  if (t === 2) {   // ecos de cinta: se repiten y se apagan
    const echo = 0.28 + 0.5 * S.params.spaceSize, fb = 0.35 + 0.3 * S.params.spaceSize;
    for (let k = 1, a = strength * fb; k <= 4 && a > 0.05; k++, a *= fb) SC.rings.push({ t0: SC.t + pre + k * echo, a });
  }
  if (SC.rings.length > 48) SC.rings.splice(0, SC.rings.length - 48);
}
function renderScene(dt) {
  SC.t += dt;
  if (S.view !== 'space') return;
  const t = S.params.spaceType, g = GEOM[t], amt = S.shown.spaceAmt;
  const playing = !S.bypass && (HOST ? S.meter > 0.0015 : true), vu = S.vu || 0;
  if (playing && vu - SC.prevVu > 0.05 && SC.t - SC.lastSpawn > 0.14) { spawnRing(0.4 + vu * 0.8); SC.lastSpawn = SC.t; }
  if (!HOST && SC.t - SC.lastSpawn > 0.75) { spawnRing(0.8); SC.lastSpawn = SC.t; }
  if (HOST && !playing && !S.bypass && SC.t - SC.lastSpawn > 2.4) { spawnRing(0.35); SC.lastSpawn = SC.t; }   // ping de reposo
  SC.prevVu = vu;
  const life = Math.min(6.5, decaySec(t, S.shown.spaceSize) * (t === 0 ? 1.3 : 0.9));
  const sw = (1.2 + (1 - S.shown.spaceTone) * 2.2).toFixed(2), bright = 0.55 + 0.45 * S.shown.spaceTone;
  // Reflexiones por fuentes imagen: el sonido "rebota" en las paredes
  const srcs = t < 2 ? [[g.sx, g.sy, 1],
      [2 * g.x0 - g.sx, g.sy, .7], [2 * g.x1 - g.sx, g.sy, .7], [g.sx, 2 * g.y0 - g.sy, .7], [g.sx, 2 * g.y1 - g.sy, .7],
      [2 * g.x0 - g.sx, 2 * g.y0 - g.sy, .4], [2 * g.x1 - g.sx, 2 * g.y0 - g.sy, .4], [2 * g.x0 - g.sx, 2 * g.y1 - g.sy, .4], [2 * g.x1 - g.sx, 2 * g.y1 - g.sy, .4]]
    : [[g.sx, g.sy, 1]];
  let d = '';
  SC.rings = SC.rings.filter(r => SC.t - r.t0 < life);
  SC.rings.forEach(r => {
    const age = SC.t - r.t0; if (age < 0) return;
    const rad = age * g.speed, fade = Math.pow(1 - age / life, 1.6) * r.a * (0.35 + 0.65 * Math.min(1, amt * 2.2)) * bright;
    if (fade < 0.02) return;
    srcs.forEach(([x, y, k]) => {
      d += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="none" stroke="#f2f2f0" stroke-width="${sw}" stroke-opacity="${(fade * k).toFixed(3)}"/>`;
    });
  });
  if (t === 2) document.querySelectorAll('#sceneStatic .star').forEach((st, i) => { if (i % 9 === ((SC.t * 3) | 0) % 9) st.setAttribute('fill-opacity', (0.2 + Math.random() * 0.7).toFixed(2)); });
  $('sceneDyn').innerHTML = d;
  $('scInfo').textContent = `PRE ${Math.round(S.shown.spacePre)} ms · ${decaySec(t, S.shown.spaceSize).toFixed(1)} s`;
}

/* ═══════════ Búsqueda y cintas del usuario ═══════════ */
const LS = 'cassette.userPresets';
const loadUser = () => { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch (e) { return []; } };
const saveUser = () => { try { localStorage.setItem(LS, JSON.stringify(S.presets.slice(S.hostCount))); } catch (e) { toast('No se pudo guardar'); } };
function refreshWheel(keep = true) {
  buildPills(); buildWheel();
  const j = W.list.indexOf(S.program);
  W.pos = W.target = keep && j >= 0 ? j : 0; W.vel = 0;
}
function onSearch() {
  S.query = $('search').value.trim();
  document.querySelector('.hint').classList.toggle('has', !!S.query);
  refreshWheel();
}
$('search').addEventListener('input', onSearch);
$('search').addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter' && W.list.length) goTo(0);
  if (e.key === 'Escape') { $('search').value = ''; onSearch(); $('search').blur(); }
});
$('searchX').onclick = () => { $('search').value = ''; onSearch(); };
function openSave(open) {
  $('saveRow').classList.toggle('open', open); $('saveBtn').classList.toggle('open', open);
  if (open) { $('saveName').value = ''; setTimeout(() => $('saveName').focus(), 60); }
}
$('saveBtn').onclick = () => openSave(!$('saveRow').classList.contains('open'));
$('saveName').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') openSave(false); });
$('saveRow').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('saveName').value.trim();
  if (!name) { $('saveName').focus(); return; }
  const v = {};
  ['age', 'wobble', 'noise', 'crush', 'tone', 'drive', 'spaceType', 'spaceAmt', 'spaceSize'].forEach(k => v[k] = S.params[k]);
  S.presets.push({ name, category: 'MIAS', desc: 'Tu cinta guardada', values: v, user: true });
  saveUser(); openSave(false);
  $('search').value = ''; S.query = ''; document.querySelector('.hint').classList.remove('has');
  S.filter = 'TODAS'; S.program = S.presets.length - 1;
  refreshWheel(); showPreset(true); toast('Cinta guardada: ' + name);
});
function deleteUser(pi) {
  if (pi == null || pi < S.hostCount) { toast('Solo puedes borrar tus cintas'); return; }
  const nm = S.presets[pi].name;
  S.presets.splice(pi, 1); saveUser();
  if (S.program >= pi) S.program = Math.max(0, S.program - 1);
  refreshWheel(); showPreset(false); toast('Cinta borrada: ' + nm);
}
$('wheel').addEventListener('contextmenu', e => {          // clic derecho en una cinta propia = borrar
  const chipEl = e.target.closest('.chip'); if (!chipEl) return;
  e.preventDefault();
  const ch = W.chips.find(c => c.el === chipEl); deleteUser(ch && W.list[ch.j]);
});
$('delBtn').onclick = () => {                               // dos pasos: primer clic arma, segundo borra
  const b = $('delBtn');
  if (!b.classList.contains('armed')) { b.classList.add('armed'); toast('Pulsa otra vez para borrar'); setTimeout(() => b.classList.remove('armed'), 2500); return; }
  deleteUser(S.program);
};

function boot(b) {
  if (b) {
    if (b.presets && b.presets.length) S.presets = b.presets;
    Object.entries(b.params || {}).forEach(([k, v]) => { if (k === 'bypass') S.bypass = v > 0.5; else if (k === 'spaceType') S.params.spaceType = Math.round(v); else if (k in DEFS) { S.params[k] = v; S.shown[k] = v; } });
    S.program = b.program | 0;
    applyTheme(b.theme === 'dark' ? 'dark' : 'light');
    if (b.version) $('badge').textContent = 'FREE · v' + b.version;
  } else applyTheme('light');
  S.hostCount = S.presets.length; S.presets = S.presets.concat(loadUser().map(p => ({ ...p, user: true })));
  buildPills(); buildWheel();
  W.pos = W.target = Math.max(0, W.list.indexOf(S.program));
  showPreset(false); renderBypass(); applySpaceType();
}
on('params', d => Object.entries(d).forEach(([k, v]) => {
  if (k === 'bypass') { S.bypass = v > 0.5; renderBypass(); }
  else if (k === 'spaceType') { if (Math.round(v) !== S.params.spaceType) { S.params.spaceType = Math.round(v); applySpaceType(); } }
  else if (k in DEFS && !knobs[k].dragging()) S.params[k] = v;
}));
on('program', p => {
  if (p === S.program) return;
  S.program = p; const j = W.list.indexOf(p);
  if (j < 0) setFilter('TODAS'); else goTo(j, false);
  showPreset(true);
});
on('meter', v => { S.meter = +v || 0; });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  renderWheel(dt); renderDeck(dt); renderKnobs(); renderScene(dt);
  requestAnimationFrame(frame);
}
(HOST ? native('uiReady') : Promise.resolve(null)).then(boot).then(() => requestAnimationFrame(frame));
window.__cassette = S;   // depuración
})();
</script>
</body>
